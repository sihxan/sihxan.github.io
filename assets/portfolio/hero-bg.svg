<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
  <title id="title">Portfolio hero research desk</title>
  <desc id="desc">Dark research desk with abstract data panels, notes, and light traces.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#091426"/>
      <stop offset="0.55" stop-color="#152845"/>
      <stop offset="1" stop-color="#06101e"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6eddc"/>
      <stop offset="1" stop-color="#d9cbb4"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5ea2ff" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#1e3f8f" stop-opacity="0.18"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1600" height="1100" fill="url(#bg)"/>
  <rect width="1600" height="1100" fill="url(#grid)"/>
  <circle cx="1180" cy="260" r="310" fill="#315da8" opacity="0.22" filter="url(#soft)"/>
  <circle cx="430" cy="730" r="300" fill="#d6a62a" opacity="0.16" filter="url(#soft)"/>
  <g opacity="0.95" transform="rotate(-7 800 550)">
    <rect x="950" y="150" width="420" height="590" rx="10" fill="url(#paper)" opacity="0.92"/>
    <rect x="990" y="210" width="250" height="10" fill="#12213a" opacity="0.18"/>
    <rect x="990" y="250" width="310" height="8" fill="#12213a" opacity="0.12"/>
    <rect x="990" y="285" width="280" height="8" fill="#12213a" opacity="0.12"/>
    <rect x="990" y="345" width="330" height="180" fill="#0a1628" opacity="0.86"/>
    <path d="M1025 475C1088 412 1133 451 1182 389C1246 309 1265 382 1315 333" fill="none" stroke="#e5b83f" stroke-width="6" stroke-linecap="round"/>
    <circle cx="1025" cy="475" r="7" fill="#e5b83f"/>
    <circle cx="1182" cy="389" r="7" fill="#e5b83f"/>
    <rect x="990" y="565" width="130" height="12" fill="#244da8" opacity="0.42"/>
    <rect x="990" y="596" width="270" height="8" fill="#12213a" opacity="0.13"/>
    <rect x="990" y="624" width="240" height="8" fill="#12213a" opacity="0.13"/>
  </g>
  <g transform="rotate(9 515 520)" opacity="0.9">
    <rect x="270" y="210" width="460" height="320" rx="18" fill="#0c1a31" stroke="#6f8fd6" stroke-opacity="0.32"/>
    <rect x="310" y="260" width="120" height="10" fill="#f0c95d" opacity="0.78"/>
    <path d="M330 432C388 330 451 445 505 338C553 243 606 329 662 276" fill="none" stroke="#79a9ff" stroke-width="9" stroke-linecap="round" opacity="0.85"/>
    <path d="M335 398C397 382 432 410 492 384C553 358 591 399 660 365" fill="none" stroke="#f1d47c" stroke-width="4" stroke-linecap="round" opacity="0.65"/>
    <g fill="#ffffff" opacity="0.2">
      <circle cx="335" cy="432" r="6"/>
      <circle cx="505" cy="338" r="6"/>
      <circle cx="662" cy="276" r="6"/>
    </g>
  </g>
  <g opacity="0.24">
    <path d="M90 760H780" stroke="#ffffff" stroke-width="1"/>
    <path d="M180 820H960" stroke="#ffffff" stroke-width="1"/>
    <path d="M70 895H610" stroke="#ffffff" stroke-width="1"/>
  </g>
  <g fill="none" stroke="#e2b63f" stroke-opacity="0.55" stroke-width="2">
    <path d="M180 180c150 120 270 120 360 0"/>
    <path d="M1060 835c135-70 245-68 330 12"/>
    <path d="M720 145c80 54 162 56 247 0"/>
  </g>
  <rect width="1600" height="1100" fill="#020713" opacity="0.12"/>
